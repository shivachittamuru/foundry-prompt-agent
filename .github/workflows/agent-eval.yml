name: Agent Evaluation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "evals/**"
      - "src/**"
      - ".github/workflows/agent-eval.yml"

permissions:
  id-token: write
  contents: read

jobs:
  evaluate-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install missing dependency
        run: python -m pip install httpx

      - name: Evaluate agents
        uses: microsoft/ai-agent-evals@v3-beta
        with:
          azure-ai-project-endpoint: ${{ vars.FOUNDRY_PROJECT_ENDPOINT }}
          deployment-name: ${{ vars.FOUNDRY_JUDGE_MODEL }}
          agent-ids: ${{ vars.FOUNDRY_AGENT_NAME }}:${{ vars.FOUNDRY_AGENT_VERSION }}
          data-path: ${{ github.workspace }}/evals/github-eval.json